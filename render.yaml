services:
  # ── Backend: Node.js/Express API ──────────────────────────────────────────
  - type: web
    name: clinic-management-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false          # Set this manually in Render dashboard
      - key: JWT_SECRET
        sync: false          # Set this manually in Render dashboard
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: PORT
        value: 5000

  # ── Frontend: React/Vite Static Site ──────────────────────────────────────
  - type: web
    name: clinic-management-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://dhyey-clinic.onrender.com
